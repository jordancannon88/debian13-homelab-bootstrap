zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: bf6177b54b3f4fe39b327f18494c3001
      name: Templates/Custom
  templates:
    - uuid: 8439714d01d9473594e7cb37be09c0ac
      template: 'Homelab LXC'
      name: 'Homelab LXC'
      description: 'The container''s OWN uptime and CPU use. Inside an LXC container /proc/uptime and /proc/loadavg are the host kernel''s numbers, so the stock Linux template''s "has been restarted", "load average is too high" and "high CPU utilization" triggers are wrong for containers (pbs0 paged twice on 2026-09-17 while idle, showing pve0''s load; container restarts never show). lxc-stat-json.sh reads the age of the container''s init process and its cgroup v2 cpu.stat, cpu.pressure and io.pressure. Link to every LXC host (autoregistration token lxcstat) and silence the three stock triggers on those hosts with zbx-lxc-silence.py (host macros LOAD_AVG_PER_CPU.MAX.WARN and CPU.UTIL.CRIT set high, stock restart trigger disabled per host). Host side installed by debian13-homelab-bootstrap monitoring.sh (setup_lxc_stat, containers only). Source of truth: zabbix/templates/homelab-lxc.yaml. Dry run: restart a container, the LXC restart Info fires within a minute and the stock one stays quiet. Kan 2g05h9zrkkr1. Docs: catalog link/376.'
      groups:
        - name: Templates/Custom
      items:
        - uuid: 1b7f6594e8284b8f96f7d9b1bdb7ea1c
          name: 'Load per CPU (5m)'
          type: CALCULATED
          key: custom.lxc.load_per_cpu
          value_type: FLOAT
          params: 'last(//custom.lxc.load5m)/last(//custom.lxc.ncpu)'
          description: 'Five minute run queue divided by the machine''s CPU count, so machines of different sizes compare. Sustained above 1 means threads are queuing for a CPU. It is NOT pressure stall information: it does not measure time spent waiting, and on Linux the load average also counts threads blocked on IO, so read it beside the pressure columns rather than instead of them. On FreeBSD the load counts only runnable threads, which makes this a cleaner CPU signal on opn1 than on the Linux guests, and the only CPU contention figure opn1 can produce at all, since FreeBSD has no PSI. Added 2026-09-21.'
          tags:
            - tag: component
              value: cpu

        - uuid: 2a9158c3f36c445ab47c1818db35cce6
          name: 'LXC: cpu_some10'
          type: DEPENDENT
          key: custom.lxc.cpu_some10
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'cgroup cpu.pressure "some" avg10: percent of the last 10 s in which at least one task of this container waited for a CPU. High with low cpu_pct means the HOST is busy and the container is being starved.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.cpu_some10
          master_item:
            key: custom.lxc.stat
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: aaeec11ac4b047fba73a146ee6292220
              expression: 'min(/Homelab LXC/custom.lxc.cpu_some10,5m)>{$LXC.CPU.PSI.WARN}'
              name: 'LXC: {HOST.NAME} is starved for CPU (waiting over {$LXC.CPU.PSI.WARN}% of the time for 5m)'
              url: 'https://bookstack.local.cannon.dev/link/467'
              url_name: Runbook
              priority: WARNING
              description: 'The container''s tasks spend a large share of their time waiting for a CPU while its own use is not the cause: the host node is busy (backups, resyncs, another guest). Look at the host''s load and top, not at this container. Recovers on its own.'
              tags:
                - tag: scope
                  value: performance
        - uuid: 964eb4c904bd40bfb6b86762a50c39c0
          name: 'Load average (own, 1m)'
          type: DEPENDENT
          key: custom.lxc.load1m
          delay: '0'
          value_type: FLOAT
          description: 'This container''s own 1m load average, read from /proc/loadavg inside the container, which lxcfs makes honest when it runs with --enable-loadavg (bootstrap harden.sh since 2026-09-20). The stock system.cpu.load item cannot be used here: it reads the figure through a system call that lxcfs does not intercept, so it always reports the host''s load, which is why the container load trigger stays silenced against the stock item. -1 where the file is still the host''s. The dashboard column matches this item by name; VMs and nodes carry a calculated item of the same name from the Homelab uptime host template.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.load1
          master_item:
            key: custom.lxc.stat
          tags:
            - tag: component
              value: cpu
        - uuid: 9dd5efe83fe2482594a28816630ecc07
          name: 'Load average (own, 5m)'
          type: DEPENDENT
          key: custom.lxc.load5m
          delay: '0'
          value_type: FLOAT
          description: 'This container''s own 5m load average, read from /proc/loadavg inside the container, which lxcfs makes honest when it runs with --enable-loadavg (bootstrap harden.sh since 2026-09-20). The stock system.cpu.load item cannot be used here: it reads the figure through a system call that lxcfs does not intercept, so it always reports the host''s load, which is why the container load trigger stays silenced against the stock item. -1 where the file is still the host''s. The dashboard column matches this item by name; VMs and nodes carry a calculated item of the same name from the Homelab uptime host template.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.load5
          master_item:
            key: custom.lxc.stat
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: 8e5daf4c8b94437c99d92dc1f1c470ce
              expression: 'min(/Homelab LXC/custom.lxc.load5m,5m)/last(/Homelab LXC/custom.lxc.ncpu)>{$LXC.LOAD.PER.CPU.WARN} and last(/Homelab LXC/custom.lxc.load5m)>=0'
              name: 'LXC: load per CPU over {$LXC.LOAD.PER.CPU.WARN} on {HOST.NAME} ({ITEM.LASTVALUE1} over {ITEM.LASTVALUE2} CPUs)'
              url: 'https://bookstack.local.cannon.dev/link/467'
              url_name: Runbook
              priority: WARNING
              description: 'This container''s own 5 minute load average per CPU it may use. The stock "Load average is too high" trigger cannot be used inside a container: the agent reads load through a system call that lxcfs does not intercept, so it always reports the node''s figure, and pbs0 paged on pve0''s load during a disk write pass on 2026-09-20. That stock trigger stays neutralised with {$LOAD_AVG_PER_CPU.MAX.WARN} = 1000; this one is the honest replacement, from /proc/loadavg inside the container. Sustained load per CPU above the threshold with low CPU use means the container is waiting on IO or being throttled: read "CPU use (own)", "stalled on IO" and the cpu.pressure item next to it. Added 2026-09-20, Kan in2f71k36m7z.'
              tags:
                - tag: scope
                  value: capacity
        - uuid: 2b6a2cae7fd240cc9a938f4465bef98a
          name: 'Load average (own, 15m)'
          type: DEPENDENT
          key: custom.lxc.load15m
          delay: '0'
          value_type: FLOAT
          description: 'This container''s own 15m load average, read from /proc/loadavg inside the container, which lxcfs makes honest when it runs with --enable-loadavg (bootstrap harden.sh since 2026-09-20). The stock system.cpu.load item cannot be used here: it reads the figure through a system call that lxcfs does not intercept, so it always reports the host''s load, which is why the container load trigger stays silenced against the stock item. -1 where the file is still the host''s. The dashboard column matches this item by name; VMs and nodes carry a calculated item of the same name from the Homelab uptime host template.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.load15
          master_item:
            key: custom.lxc.stat
          tags:
            - tag: component
              value: cpu
        - uuid: c3e7f73aeb8647ea9456af15685502a5
          name: 'CPU use (own)'
          type: DEPENDENT
          key: custom.lxc.cpu_pct
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'CPU used by this container over a 1 s sample, as a percent of the CPUs it may use (cgroup cpu.stat usage_usec / ncpu). -1 if the cgroup files are not readable.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.cpu_pct
          master_item:
            key: custom.lxc.stat
          tags:
            - tag: component
              value: cpu
          triggers:
            - uuid: fadaae9bce5243e39449945c373c3f39
              expression: 'min(/Homelab LXC/custom.lxc.cpu_pct,5m)>{$LXC.CPU.UTIL.CRIT}'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'max(/Homelab LXC/custom.lxc.cpu_pct,5m)<{$LXC.CPU.UTIL.CRIT}-10'
              name: 'LXC: {HOST.NAME} CPU use over {$LXC.CPU.UTIL.CRIT}% for 5m'
              url: 'https://bookstack.local.cannon.dev/link/468'
              url_name: Runbook
              priority: WARNING
              description: 'The container itself is using nearly all the CPU it is allowed. This is the container''s own work, not the host''s. Recovers when use drops 10 points below the limit.'
              tags:
                - tag: scope
                  value: performance
        - uuid: 6e6ca2901248460db7debcf29bfa2d57
          name: 'LXC: CPUs'
          type: DEPENDENT
          key: custom.lxc.ncpu
          delay: '0'
          description: 'CPUs the container may use (nproc inside the container).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ncpu
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 6h
          master_item:
            key: custom.lxc.stat
          tags:
            - tag: component
              value: cpu
        - uuid: a4adc6152acf47eaa393e6f4a13c5299
          name: 'IO pressure (full 10s)'
          type: DEPENDENT
          key: custom.lxc.io_full10
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'cgroup io.pressure "full" avg10: percent of the last 10 s in which every task of this container was stalled on IO. The container''s own number; /proc/pressure/io inside a container is the host''s.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.io_full10
          master_item:
            key: custom.lxc.stat
          tags:
            - tag: component
              value: storage
          triggers:
            - uuid: bc6f41ede321410c82e72a29d1fd3834
              expression: 'min(/Homelab LXC/custom.lxc.io_full10,5m)>{$LXC.IO.PSI.FULL.WARN}'
              name: 'LXC: {HOST.NAME} stalled on IO (full over {$LXC.IO.PSI.FULL.WARN}% for 5m)'
              url: 'https://bookstack.local.cannon.dev/link/469'
              url_name: Runbook
              priority: WARNING
              description: 'This container''s own tasks are stalled on IO, not the host''s. Look at what the container does (backup, database, scan) and at the disk its volume lives on. Recovers on its own.'
              tags:
                - tag: scope
                  value: performance
        - uuid: 248494950fb541a8b89a90a03bd06143
          name: 'LXC: io_some10'
          type: DEPENDENT
          key: custom.lxc.io_some10
          delay: '0'
          value_type: FLOAT
          units: '%'
          description: 'cgroup io.pressure "some" avg10 of this container.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.io_some10
          master_item:
            key: custom.lxc.stat
          tags:
            - tag: component
              value: storage
        - uuid: 5a811bfe80ce4bbbabc517e1a381f1aa
          name: 'LXC: stat (raw)'
          type: ZABBIX_ACTIVE
          key: custom.lxc.stat
          delay: 1m
          history: '0'
          value_type: TEXT
          description: 'JSON from lxc-stat-json.sh: uptime, ncpu, cpu_pct, cpu_some10. Master item for the LXC dependents.'
          tags:
            - tag: component
              value: raw
        - uuid: 598ef9c8d564440ab3d32afb6088f3ad
          name: 'Uptime (own)'
          type: DEPENDENT
          key: custom.lxc.uptime
          delay: '0'
          units: uptime
          description: 'Seconds since the container''s own init (PID 1) started. Unlike system.uptime this resets when the container restarts, not when the host does. Named "Uptime (own)" on purpose: the Homelab uptime host template gives VMs and nodes an item of the same name, so one dashboard column shows every host''s own uptime.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.uptime
          master_item:
            key: custom.lxc.stat
          tags:
            - tag: component
              value: system
          triggers:
            - uuid: dc2f4b36ce9b4520874ff95344d26d0f
              expression: 'last(/Homelab LXC/custom.lxc.uptime)<10m'
              name: 'LXC: {HOST.NAME} has been restarted (up {ITEM.LASTVALUE1})'
              url: 'https://bookstack.local.cannon.dev/link/466'
              url_name: Runbook
              priority: INFO
              description: 'The container''s init process is younger than 10 minutes: the container was restarted (pct stop/start, HA relocation, host reboot). The stock Linux "has been restarted" trigger cannot see this because it reads the host kernel''s uptime. Recovers on its own after 10 minutes.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: class
          value: custom
      macros:
        - macro: '{$LXC.IO.PSI.FULL.WARN}'
          value: '25'
          description: 'io.pressure full avg10 percent above which the container counts as stalled on IO'
        - macro: '{$LXC.LOAD.PER.CPU.WARN}'
          value: '1.5'
          description: 'This container''s own 5 minute load average per CPU above which it counts as overloaded. Replaces the stock {$LOAD_AVG_PER_CPU.MAX.WARN}, which inside a container reads the node''s load.'
        - macro: '{$LXC.CPU.PSI.WARN}'
          value: '50'
          description: 'cpu.pressure some avg10 percent above which the container is considered starved by the host'
        - macro: '{$LXC.CPU.UTIL.CRIT}'
          value: '90'
          description: 'Container CPU use percent (of its own CPUs) above which the Warning fires'
