zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: bf6177b54b3f4fe39b327f18494c3001
      name: Templates/Custom
  templates:
    - uuid: 438d8461f1c14c4684e9ec8536c481dc
      template: 'Homelab uptime host'
      name: 'Homelab uptime host'
      description: 'Two items, "Uptime (own)" and "CPU use (own)", a calculated mirror of the stock system.uptime for VMs and bare-metal nodes. It exists so a dashboard column matched by item name shows every host''s own uptime in one column: containers get an item of the same name from Homelab LXC (their init age), everything else gets this one. Linked by autoregistration tokens vm and metal (zbx-autoreg.py). Source of truth: zabbix/templates/homelab-uptime-host.yaml in debian13-homelab-bootstrap. Kan 2g05h9zrkkr1.'
      groups:
        - name: Templates/Custom
      items:
        - uuid: f6147b93f96b4af790e5dcb01fa7fa29
          name: 'Load per CPU (5m)'
          type: CALCULATED
          key: custom.load_per_cpu
          value_type: FLOAT
          params: 'last(//custom.load5m)/last(//system.cpu.num)'
          description: 'Five minute run queue divided by the machine's CPU count, so machines of different sizes compare. Sustained above 1 means threads are queuing for a CPU. It is NOT pressure stall information: it does not measure time spent waiting, and on Linux the load average also counts threads blocked on IO, so read it beside the pressure columns rather than instead of them. On FreeBSD the load counts only runnable threads, which makes this a cleaner CPU signal on opn1 than on the Linux guests, and the only CPU contention figure opn1 can produce at all, since FreeBSD has no PSI. Added 2026-09-21.'
          tags:
            - tag: component
              value: cpu

        - uuid: f4d49870dc47413dba24db62ec21c41c
          name: 'Load average (own, 1m)'
          type: CALCULATED
          key: custom.load1m
          value_type: FLOAT
          params: 'last(//system.cpu.load[all,avg1])'
          description: 'Mirror of the stock 1m load average under a name shared with the containers'' own item, so one dashboard column reads every machine. On a VM or a node the stock item is already the machine''s own figure; only inside a container is it the host''s, which the Homelab LXC template handles.'
          tags:
            - tag: component
              value: cpu
        - uuid: 7395a27eb865417391b15ccf0ac1ac95
          name: 'Load average (own, 5m)'
          type: CALCULATED
          key: custom.load5m
          value_type: FLOAT
          params: 'last(//system.cpu.load[all,avg5])'
          description: 'Mirror of the stock 5m load average under a name shared with the containers'' own item, so one dashboard column reads every machine. On a VM or a node the stock item is already the machine''s own figure; only inside a container is it the host''s, which the Homelab LXC template handles.'
          tags:
            - tag: component
              value: cpu
        - uuid: c88f4b7f0b42438f8bc10b8ed8af8efb
          name: 'Load average (own, 15m)'
          type: CALCULATED
          key: custom.load15m
          value_type: FLOAT
          params: 'last(//system.cpu.load[all,avg15])'
          description: 'Mirror of the stock 15m load average under a name shared with the containers'' own item, so one dashboard column reads every machine. On a VM or a node the stock item is already the machine''s own figure; only inside a container is it the host''s, which the Homelab LXC template handles.'
          tags:
            - tag: component
              value: cpu
        - uuid: b379982b62744370870c8f5f30781995
          name: 'CPU use (own)'
          type: CALCULATED
          key: custom.cpu_util
          delay: 1m
          value_type: FLOAT
          units: '%'
          params: 'last(//system.cpu.util)'
          description: 'Mirror of system.cpu.util under the shared name "CPU use (own)": containers carry the same name from Homelab LXC (their cgroup), so one dashboard column shows every host''s own CPU.'
          tags:
            - tag: component
              value: cpu
        - uuid: 3b64e9406ca24835ab74186744a2ef2f
          name: 'Uptime (own)'
          type: CALCULATED
          key: custom.uptime
          delay: 1m
          units: uptime
          params: 'last(//system.uptime)'
          description: 'Mirror of system.uptime under the shared name "Uptime (own)" (see the template description).'
          tags:
            - tag: component
              value: system
      tags:
        - tag: class
          value: custom
