zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: bf6177b54b3f4fe39b327f18494c3001
      name: Templates/Custom
  templates:
    - uuid: 624f2e842f1a4ebc993198d8e086f14f
      template: 'Homelab drives'
      name: 'Homelab drives'
      description: 'One item per physical drive, discovered by serial, so a drive reads as one row of a table (Kan bfrdv9wpggve). Every drive item carries tag drive (the drive) and tag fact (which column it is), so a table can pivot on them without parsing names. This template does NOT alert: the SMART template already discovers these drives and fires on health, temperature, reallocated sectors and failed self-tests, so the SMART figures here are read-only. Keyed on serial rather than device letter, because sdb is whatever the kernel enumerated second this boot. Host side: /usr/local/bin/disk-info.py run as root every minute by zbx-diskinfo.timer, writing /run/zbx-diskinfo.json; the UserParameter custom.diskinfo only reads that file, so no collection runs inside the agent''s 3 second timeout. Sleeping drives are never woken: every smartctl call carries -n standby, and the full SMART read runs at most hourly. Virtual disks are filtered out of discovery. Values that do not apply are -1, never 0. Link to bare metal and VMs with real disks, not containers. Source of truth: zabbix/templates/homelab-drives.yaml.'
      groups:
        - name: Templates/Custom
      items:
        - uuid: 908a2e42e572470f974070cf55362728
          name: 'Drive inventory (raw)'
          type: ZABBIX_ACTIVE
          key: custom.diskinfo
          delay: 1m
          history: 1d
          value_type: TEXT
          trends: '0'
          description: 'Every whole disk on this machine as one JSON document, read from /run/zbx-diskinfo.json, which zbx-diskinfo.timer rewrites every minute. Holds the discovery list and every per drive value below, so one poll answers for every drive.'
          tags:
            - tag: component
              value: storage
      discovery_rules:
        - uuid: f509895566134e4aa8716b00c0ac606b
          name: 'Drive discovery'
          type: DEPENDENT
          key: custom.diskinfo.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#MODEL}'
                value: '^QEMU'
                operator: NOT_MATCHES_REGEX
                formulaid: A
          lifetime: 30d
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          description: 'One row per physical disk, keyed on serial. Virtual disks (model QEMU) are filtered out: they have no serial, move with the VM and are not a drive anyone replaces. A drive that disappears is disabled at once and deleted after thirty days, so a drive moved between hosts keeps its history long enough to compare.'
          item_prototypes:
            - uuid: 5032d1757301479299f722297046611f
              name: '[{#DRIVE}] serial'
              type: DEPENDENT
              key: 'custom.disk.serial[{#SERIAL}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'Drive serial, the identity everything else is keyed on. Device letters move between boots; this does not.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$['drives']['{#SERIAL}']['serial']"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: custom.diskinfo
              tags:
                - tag: component
                  value: storage
                - tag: drive
                  value: '{#DRIVE}'
                - tag: fact
                  value: serial
            - uuid: e87080c4754d47d1a54e55a9788d8586
              name: '[{#DRIVE}] link'
              type: DEPENDENT
              key: 'custom.disk.link[{#SERIAL}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'How the drive is attached: SATA, NVMe, or USB with the kernel driver named. On this hardware USB uas is the known corruption risk (pms0 XFS 2026-09-16, 152 ZFS checksum errors on pve2 2026-09-18) and usb-storage is the fix, so a row reading "USB uas" wants attention.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$['drives']['{#SERIAL}']['link']"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: custom.diskinfo
              tags:
                - tag: component
                  value: storage
                - tag: drive
                  value: '{#DRIVE}'
                - tag: fact
                  value: link
            - uuid: baa6b579e7b64897b219e0808a31b725
              name: '[{#DRIVE}] role'
              type: DEPENDENT
              key: 'custom.disk.role[{#SERIAL}]'
              delay: '0'
              value_type: CHAR
              trends: '0'
              description: 'What the drive is for: the ZFS pools it belongs to and the filesystems mounted from it, or "unmounted".'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$['drives']['{#SERIAL}']['role']"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: custom.diskinfo
              tags:
                - tag: component
                  value: storage
                - tag: drive
                  value: '{#DRIVE}'
                - tag: fact
                  value: role
            - uuid: 1654339163e64f82844ffb81312df2c2
              name: '[{#DRIVE}] size'
              type: DEPENDENT
              key: 'custom.disk.size[{#SERIAL}]'
              delay: '0'
              value_type: UNSIGNED
              units: 'B'
              description: 'Capacity from /sys/block, the vendor figure.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$['drives']['{#SERIAL}']['size']"
                - type: DISCARD_UNCHANGED_HEARTBEAT
