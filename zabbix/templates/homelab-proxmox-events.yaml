zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: bf6177b54b3f4fe39b327f18494c3001
      name: Templates/Custom
  templates:
    - uuid: 70c85608cc684203b91ef91082f0359c
      template: 'Homelab Proxmox events'
      name: 'Homelab Proxmox events'
      description: 'Proxmox VE events that used to post to buzz #Alerts. Replication: every pvesr job as an LLD row (fails, state, last sync, enabled) from custom.pve.replication (pve-replication-json.sh via a sudoers line limited to `pvesr status`), failing High, missed-schedule Warning (2 h past the job''s own next sync), script-error High. Backups: failed vzdump tasks as a sticky High from custom.pve.backup (pve-backup-json.py, pvesh through sudo; test marker /etc/zabbix/homelab-test/backup). HA events: recover (High, sticky) and migrate/relocate (Information, sticky) from the pve-ha-crm journal via custom.pve.ha (pve-ha-events-json.sh, no sudo; test marker /etc/zabbix/homelab-test/ha-event). Host side installed by debian13-homelab-bootstrap monitoring.sh (ZABBIX_PVE_EVENTS). Source of truth: zabbix/templates/homelab-proxmox-events.yaml in that repo. Kan q7wzccj15ypp, tracker a25kba4yp866.'
      groups:
        - name: Templates/Custom
      items:
        - uuid: c52e116a9caa45aebbcd44efbb619ba3
          name: 'Replication status (raw)'
          type: ZABBIX_ACTIVE
          key: custom.pve.replication
          delay: 5m
          history: '0'
          value_type: TEXT
          timeout: 30s
          description: 'JSON from pve-replication-json.sh. Master for every replication item and the job discovery.'
          tags:
            - tag: component
              value: raw
            - tag: component
              value: replication
        - uuid: 42933517d3ae4a359544ba46fe0bc999
          name: 'Replication: status script error'
          type: DEPENDENT
          key: 'custom.pve.replication.error'
          value_type: CHAR
          trends: '0'
          description: 'Non-empty when pve-replication-json.sh could not run pvesr status. Empty is healthy.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$.error"
              error_handler: CUSTOM_VALUE
              error_handler_params: ''
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.replication
          tags:
            - tag: component
              value: replication
          triggers:
            - uuid: 3a0c55dc31f44d399b9354caad902cfd
              expression: 'length(last(/Homelab Proxmox events/custom.pve.replication.error))>0'
              name: 'Replication: status script failed on {HOST.NAME}'
              url: 'https://bookstack.local.cannon.dev/link/438'
              url_name: Runbook
              priority: HIGH
              description: 'pvesr status did not run (sudoers, pmxcfs or pvesr itself); every replication trigger on this host is blind. Value: {ITEM.LASTVALUE1}'
              tags:
                - tag: scope
                  value: availability
        - uuid: e28d2a27422c4c188df9e75d303145d4
          name: 'Replication: jobs on this node'
          type: DEPENDENT
          key: 'custom.pve.replication.job_count'
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$.job_count"
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.replication
          tags:
            - tag: component
              value: replication
        - uuid: 83847d3e6968407ca4e47aebb1670b71
          name: 'Replication: failing jobs'
          type: DEPENDENT
          key: 'custom.pve.replication.failing_count'
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$.failing_count"
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.replication
          tags:
            - tag: component
              value: replication
        - uuid: 47554f0d02bd4d0fb944a3a2325da81a
          name: 'Backup tasks (raw)'
          type: ZABBIX_ACTIVE
          key: custom.pve.backup
          delay: 5m
          history: '0'
          value_type: TEXT
          timeout: 30s
          description: 'JSON from pve-backup-json.py (finished vzdump tasks since the last run, via pvesh through sudo). Master for every backup item.'
          tags:
            - tag: component
              value: raw
            - tag: component
              value: backup
        - uuid: c4588652f2ed44818a6c458d6bec0354
          name: 'Backup: task script error'
          type: DEPENDENT
          key: custom.pve.backup.error
          value_type: CHAR
          trends: '0'
          description: 'Non-empty when pve-backup-json.py could not read the task list (pvesh, sudoers). Empty is healthy.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
              error_handler: CUSTOM_VALUE
              error_handler_params: ''
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.backup
          tags:
            - tag: component
              value: backup
          triggers:
            - uuid: 38ee1c8e63de4031b9fa6fcf2adeaeec
              expression: 'length(last(/Homelab Proxmox events/custom.pve.backup.error))>0'
              name: 'Backup: task script failed on {HOST.NAME}'
              url: 'https://bookstack.local.cannon.dev/link/438'
              url_name: Runbook
              priority: HIGH
              description: 'pvesh get /nodes/<host>/tasks did not run; backup failures on this host are invisible until fixed. Value: {ITEM.LASTVALUE1}'
              tags:
                - tag: scope
                  value: availability
        - uuid: 00ec384619404e0f812ab03075708f15
          name: 'Backup: failed vzdump tasks (total since install)'
          type: DEPENDENT
          key: custom.pve.backup.failed_total
          description: 'Monotonic count of vzdump tasks that finished with a status other than OK. Rises by the number of new failures per poll.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.failed_total
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.backup
          tags:
            - tag: component
              value: backup
        - uuid: 6c88e6782bf4409fbb8855f920efe042
          name: 'Backup: last failed task'
          type: DEPENDENT
          key: custom.pve.backup.last_failed
          value_type: CHAR
          trends: '0'
          description: 'Newest failed vzdump task: guest id, end time, status text.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.last_failed
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.backup
          tags:
            - tag: component
              value: backup
          triggers:
            - uuid: 0e54983e2cbf499c821afb225b622573
              expression: 'last(/Homelab Proxmox events/custom.pve.backup.last_failed,#1)<>last(/Homelab Proxmox events/custom.pve.backup.last_failed,#2) and length(last(/Homelab Proxmox events/custom.pve.backup.last_failed))>0'
              recovery_mode: NONE
              name: 'Backup: vzdump task failed on {HOST.NAME}: {ITEM.LASTVALUE1}'
              url: 'https://bookstack.local.cannon.dev/link/439'
              url_name: Runbook
              type: MULTIPLE
              priority: HIGH
              description: 'A backup task finished with an error (job errors, storage unreachable, guest lock...). Fires when the newest failed task changes, once per failure. Read the task log in PVE > node > Task History, then the PBS datastore. Never recovers on its own; close by hand once acted on.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: 88f65a0ed8384d4f827bf4babc5b130c
          name: 'Backup: last successful task'
          type: DEPENDENT
          key: custom.pve.backup.last_ok_epoch
          units: 'unixtime'
          description: 'End time of the newest vzdump task that finished OK on this node.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.last_ok_epoch
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.backup
          tags:
            - tag: component
              value: backup
        - uuid: e286be4da5814dd29c94cd16139c007d
          name: 'Backup: failed tasks in 24 h'
          type: DEPENDENT
          key: custom.pve.backup.failed_24h
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.failed_24h
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.backup
          tags:
            - tag: component
              value: backup
        - uuid: 99b56ebc2a3242b1ac6dabf039d96769
          name: 'Backup: successful tasks in 24 h'
          type: DEPENDENT
          key: custom.pve.backup.ok_24h
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.ok_24h
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.backup
          tags:
            - tag: component
              value: backup
        - uuid: 164dd28d0a2846e59b00d2e37aa4bc19
          name: 'Backup: vzdump tasks running'
          type: DEPENDENT
          key: custom.pve.backup.running
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.running
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.backup
          tags:
            - tag: component
              value: backup
        - uuid: d9d406c5dbe045a6b0f69beadc5f58e7
          name: 'HA events (raw)'
          type: ZABBIX_ACTIVE
          key: custom.pve.ha
          delay: 1m
          history: '0'
          value_type: TEXT
          timeout: 15s
          description: 'JSON from pve-ha-events-json.sh (pve-ha-crm journal through a cursor; only the CRM master logs HA events). Master for every HA item.'
          tags:
            - tag: component
              value: raw
            - tag: component
              value: ha
        - uuid: 2e47afe5681d4a99ad3c390600c8d8d7
          name: 'HA: event script error'
          type: DEPENDENT
          key: custom.pve.ha.error
          value_type: CHAR
          trends: '0'
          description: 'Non-empty when pve-ha-events-json.sh could not read the pve-ha-crm journal (journal group, cursor file). Empty is healthy.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.error
              error_handler: CUSTOM_VALUE
              error_handler_params: ''
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.ha
          tags:
            - tag: component
              value: ha
          triggers:
            - uuid: 7f82204f50584978a261ba7dca744f62
              expression: 'length(last(/Homelab Proxmox events/custom.pve.ha.error))>0'
              name: 'HA: event script failed on {HOST.NAME}'
              url: 'https://bookstack.local.cannon.dev/link/438'
              url_name: Runbook
              priority: HIGH
              description: 'The HA event collector cannot read the journal on this node; recover events would go unseen while it is CRM master. Value: {ITEM.LASTVALUE1}'
              tags:
                - tag: scope
                  value: availability
        - uuid: db378dbdf06c4989aa20daf7a929810d
          name: 'HA: guests recovered from fenced nodes (total since install)'
          type: DEPENDENT
          key: custom.pve.ha.recover_total
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.recover_total
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.ha
          tags:
            - tag: component
              value: ha
        - uuid: aeb008ff9bdf4a73b842221d073d093f
          name: 'HA: guests moved (total since install)'
          type: DEPENDENT
          key: custom.pve.ha.move_total
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.move_total
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.ha
          tags:
            - tag: component
              value: ha
        - uuid: 26c067edf86447cf91e670a12388c439
          name: 'HA: last recover'
          type: DEPENDENT
          key: custom.pve.ha.last_recover
          value_type: CHAR
          trends: '0'
          description: 'Newest "recover service ... from fenced node" event: guest, from, to, time.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.last_recover
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.ha
          tags:
            - tag: component
              value: ha
          triggers:
            - uuid: 068c56fcf32f472aa432f1e0a3a0e513
              expression: 'last(/Homelab Proxmox events/custom.pve.ha.last_recover,#1)<>last(/Homelab Proxmox events/custom.pve.ha.last_recover,#2) and length(last(/Homelab Proxmox events/custom.pve.ha.last_recover))>0'
              recovery_mode: NONE
              name: 'HA: guest recovered from a fenced node: {ITEM.LASTVALUE1}'
              url: 'https://bookstack.local.cannon.dev/link/440'
              url_name: Runbook
              type: MULTIPLE
              priority: HIGH
              description: 'HA recovered a guest because its node fenced itself (watchdog reboot after lost quorum). The guest now runs from its last replication sync. Find out why the node fenced before moving guests back (report link/357, pve3 link/374). Never recovers on its own, one problem per event; close by hand.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
        - uuid: ceaddbbfa6844877ac6b76cf4e5f882c
          name: 'HA: last move'
          type: DEPENDENT
          key: custom.pve.ha.last_move
          value_type: CHAR
          trends: '0'
          description: 'Newest migrate or relocate event: action, guest, target node, time.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.last_move
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: custom.pve.ha
          tags:
            - tag: component
              value: ha
          triggers:
            - uuid: 6fe6ebd84730490e82a5e78042637e5a
              expression: 'last(/Homelab Proxmox events/custom.pve.ha.last_move,#1)<>last(/Homelab Proxmox events/custom.pve.ha.last_move,#2) and length(last(/Homelab Proxmox events/custom.pve.ha.last_move))>0'
              recovery_mode: NONE
              name: 'HA: guest moved: {ITEM.LASTVALUE1}'
              url: 'https://bookstack.local.cannon.dev/link/441'
              url_name: Runbook
              type: MULTIPLE
              priority: INFO
              description: 'An HA-managed guest was migrated or relocated (audit trail). Close by hand.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 9f1e39ea9f514f7a95cba80847997e91
          name: 'Replication job discovery'
          type: DEPENDENT
          key: custom.pve.replication.discovery
          lifetime: 7d
          enabled_lifetime_type: DISABLE_IMMEDIATELY
          description: 'One row per pvesr job on this node (and the synthetic TEST-0 while the test marker exists).'
          item_prototypes:
            - uuid: 7250d211e291471b819ea94ad1e7c73c
              name: 'Replication [{#JOB}] guest {#GUEST} to {#TARGET}: consecutive failures'
              type: DEPENDENT
              key: 'custom.pve.replication.fails[{#JOB}]'
              description: 'FailCount column of pvesr status. Non-zero means the last sync attempts failed; changes since the last good sync are unprotected.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$['jobs']['{#JOB}']['fails']"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: custom.pve.replication
              tags:
                - tag: component
                  value: replication
                - tag: job
                  value: '{#JOB}'
                - tag: guest
                  value: '{#GUEST}'
                - tag: target
                  value: '{#TARGET}'
              trigger_prototypes:
                - uuid: 6307020fb5cb43829419d53582748d8d
                  expression: 'last(/Homelab Proxmox events/custom.pve.replication.fails[{#JOB}])>0'
                  name: 'Replication: job {#JOB} (guest {#GUEST}) to {#TARGET} failing, {ITEM.LASTVALUE1} in a row'
                  url: 'https://bookstack.local.cannon.dev/link/436'
                  url_name: Runbook
                  priority: HIGH
                  description: 'Replication of guest {#GUEST} to {#TARGET} keeps failing; an HA recover would boot the last good copy. Read the error in the job state item, then `pvesr status` on the node. Runbook link/355. Clears on its own when the next sync succeeds.'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 3d0ecfb66cb041f98604e6498e6b507c
              name: 'Replication [{#JOB}] guest {#GUEST} to {#TARGET}: state'
              type: DEPENDENT
              key: 'custom.pve.replication.state[{#JOB}]'
              value_type: CHAR
              trends: '0'
              description: 'OK, or the error text pvesr reports for the failing job.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$['jobs']['{#JOB}']['state']"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: custom.pve.replication
              tags:
                - tag: component
                  value: replication
                - tag: job
                  value: '{#JOB}'
                - tag: guest
                  value: '{#GUEST}'
                - tag: target
                  value: '{#TARGET}'
            - uuid: 703c13c7294b4d85a8956f2d60283700
              name: 'Replication [{#JOB}] guest {#GUEST} to {#TARGET}: last sync'
              type: DEPENDENT
              key: 'custom.pve.replication.last_sync[{#JOB}]'
              units: 'unixtime'
              description: 'End of the last successful sync. 0 when the job never synced.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$['jobs']['{#JOB}']['last_sync']"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: custom.pve.replication
              tags:
                - tag: component
                  value: replication
                - tag: job
                  value: '{#JOB}'
                - tag: guest
                  value: '{#GUEST}'
                - tag: target
                  value: '{#TARGET}'
            - uuid: e8bebd1756e24a8f9e05ce21aa6fb56d
              name: 'Replication [{#JOB}] guest {#GUEST} to {#TARGET}: enabled'
              type: DEPENDENT
              key: 'custom.pve.replication.enabled[{#JOB}]'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$['jobs']['{#JOB}']['enabled']"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: custom.pve.replication
              tags:
                - tag: component
                  value: replication
                - tag: job
                  value: '{#JOB}'
                - tag: guest
                  value: '{#GUEST}'
                - tag: target
                  value: '{#TARGET}'
              trigger_prototypes:
                - uuid: dc625e111d744a86b726c60ff3c19f8f
                  expression: 'min(/Homelab Proxmox events/custom.pve.replication.enabled[{#JOB}],{$REPL_DISABLED_GRACE})=0'
                  name: 'Replication: job {#JOB} (guest {#GUEST}) to {#TARGET} has been disabled for over {$REPL_DISABLED_GRACE}'
                  url: 'https://bookstack.local.cannon.dev/link/436'
                  url_name: Runbook
                  priority: WARNING
                  description: 'This replication job is switched off, so guest {#GUEST} has no fresh copy on {#TARGET}. Disabling a job is a normal maintenance step, which is why this waits {$REPL_DISABLED_GRACE} before saying anything, but a job left off is invisible otherwise: nothing else in the system reports it, and the guest simply stops being protected. Every mistake of this shape in the 2026-09-21 disk work was of the form "something was turned off and nothing noticed", including a guard script whose handback sat on the one code path that would not run. If the job belongs to CT 901 the stakes are higher, because those two jobs are the only fresh second copy of the PBS datastore that every backup on the cluster writes to. Re-enable with `pvesr enable {#JOB}` on the node, or decide the job is genuinely retired and delete it rather than leaving it disabled. Clears on its own once the job is enabled again.'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: a9ea496211f54282b89b5275ed026df0
              name: 'Replication [{#JOB}] guest {#GUEST} to {#TARGET}: next scheduled sync'
              type: DEPENDENT
              key: 'custom.pve.replication.next_sync[{#JOB}]'
              units: 'unixtime'
              description: 'Next sync time pvesr has scheduled for the job. 0 when pending or unknown. The schedule-aware lateness trigger hangs off this item.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$['jobs']['{#JOB}']['next_sync']"
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1h
              master_item:
                key: custom.pve.replication
              tags:
                - tag: component
                  value: replication
                - tag: job
                  value: '{#JOB}'
                - tag: guest
                  value: '{#GUEST}'
                - tag: target
                  value: '{#TARGET}'
              trigger_prototypes:
                - uuid: 6b239c802f494da18cd4ed6c9970e30d
                  expression: 'last(/Homelab Proxmox events/custom.pve.replication.next_sync[{#JOB}])>0 and now()-last(/Homelab Proxmox events/custom.pve.replication.next_sync[{#JOB}])>{$REPL_LATE_GRACE} and last(/Homelab Proxmox events/custom.pve.replication.enabled[{#JOB}])=1'
                  name: 'Replication: job {#JOB} to {#TARGET} missed its schedule (over {$REPL_LATE_GRACE} past the next sync)'
                  url: 'https://bookstack.local.cannon.dev/link/437'
                  url_name: Runbook
                  priority: WARNING
                  description: 'An enabled job is more than {$REPL_LATE_GRACE} past the next sync time pvesr scheduled for it: the schedule stopped or syncs are not completing. Judged by each job''s own schedule, so 15-minute and nightly jobs share one value. Check `pvesr status` and the job schedule on the node.'
                  tags:
                    - tag: scope
                      value: availability
          master_item:
            key: custom.pve.replication
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.lld_jobs
      tags:
        - tag: class
          value: custom
      macros:
        - macro: '{$REPL_DISABLED_GRACE}'
          value: 6h
          description: 'How long a replication job may stay disabled before it is reported. Long enough for a deliberate maintenance window such as a pool scrub, short enough that a job left off overnight is noticed.'
        - macro: '{$REPL_LATE_GRACE}'
          value: 2h
          description: 'Warning when an enabled replication job is this long past the next sync time pvesr scheduled for it. Schedule-aware, so 15-minute and nightly jobs share one value.'
