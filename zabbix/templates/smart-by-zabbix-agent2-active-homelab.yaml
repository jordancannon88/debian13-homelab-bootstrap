                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: inventory
                - tag: diskname
                  value: '{#NAME}'
                - tag: serial
                  value: '{#SN}'
                - tag: model
                  value: '{#MODEL}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: d5cef21c49994c3e8e12ef6471d7cdcd
              name: '[{#NAME}]: Percentage used'
              type: DEPENDENT
              key: 'smart.disk.percentage_used[{#NAME}]'
              units: '%'
              description: |
                Contains a vendor specific estimate of the percentage of NVM subsystem
                life used based on the actual usage and the manufacturer's prediction of NVM
                life. A value of 100 indicates that the estimated endurance of the NVM in
                the NVM subsystem has been consumed, but may not indicate an NVM subsystem
                failure. The value is allowed to exceed 100. Percentages greater than 254
                shall be represented as 255. This value shall be updated once per power-on
                hour (when the controller is not in a sleep state).
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.percentage_used
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: serial
                  value: '{#SN}'
                - tag: model
                  value: '{#MODEL}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 68f373252bee4f9e8f3b33d04fc1adbd
                  expression: 'last(/SMART by Zabbix agent 2 active/smart.disk.percentage_used[{#NAME}])>90'
                  name: 'SMART: [{#NAME}]: NVMe disk percentage using is over 90% of estimated endurance'
                  priority: AVERAGE
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 189d8e8d16ed40229ba3ca52b75d2dc4
              name: '[{#NAME}]: Serial number'
              type: DEPENDENT
              key: 'smart.disk.sn[{#NAME}]'
              value_type: CHAR
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.serial_number
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: inventory
                - tag: diskname
                  value: '{#NAME}'
                - tag: serial
                  value: '{#SN}'
                - tag: model
                  value: '{#MODEL}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 2d5cf100fe094c819d725ee598d37de8
                  expression: 'last(/SMART by Zabbix agent 2 active/smart.disk.sn[{#NAME}],#1)<>last(/SMART by Zabbix agent 2 active/smart.disk.sn[{#NAME}],#2) and length(last(/SMART by Zabbix agent 2 active/smart.disk.sn[{#NAME}]))>0'
                  name: 'SMART: [{#NAME}]: Disk has been replaced'
                  event_name: 'SMART: [{#NAME}]: Disk has been replaced (new serial number received)'
                  priority: INFO
                  description: 'Device serial number has changed. Acknowledge to close the problem manually.'
                  manual_close: 'YES'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: e79eaaf7ee0d40e7b91fc019f5edb19e
              name: '[{#NAME}]: Temperature'
              type: DEPENDENT
              key: 'smart.disk.temperature[{#NAME}]'
              units: °C
              description: 'Current drive temperature.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.temperature
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: temperature
                - tag: diskname
                  value: '{#NAME}'
                - tag: serial
                  value: '{#SN}'
                - tag: model
                  value: '{#MODEL}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 7f46b24934854866849dd758cb5999d5
                  expression: 'avg(/SMART by Zabbix agent 2 active/smart.disk.temperature[{#NAME}],5m)>{$SMART.TEMPERATURE.MAX.CRIT:"{#DISKTYPE}"}'
                  name: 'SMART: [{#NAME}]: Average disk temperature is critical'
                  event_name: 'SMART: [{#NAME}]: Average disk temperature is critical (over {$SMART.TEMPERATURE.MAX.CRIT:"{#DISKTYPE}"}°C for 5m)'
                  priority: AVERAGE
                  tags:
                    - tag: scope
                      value: notice
                - uuid: c903a37f4b004e1593ef85ac893c3f6c
                  expression: 'avg(/SMART by Zabbix agent 2 active/smart.disk.temperature[{#NAME}],5m)>{$SMART.TEMPERATURE.MAX.WARN:"{#DISKTYPE}"}'
                  name: 'SMART: [{#NAME}]: Average disk temperature is too high'
                  event_name: 'SMART: [{#NAME}]: Average disk temperature is too high (over {$SMART.TEMPERATURE.MAX.WARN:"{#DISKTYPE}"}°C for 5m)'
                  priority: WARNING
                  dependencies:
                    - name: 'SMART: [{#NAME}]: Average disk temperature is critical'
                      expression: 'avg(/SMART by Zabbix agent 2 active/smart.disk.temperature[{#NAME}],5m)>{$SMART.TEMPERATURE.MAX.CRIT:"{#DISKTYPE}"}'
                  tags:
                    - tag: scope
                      value: notice
            - uuid: 2475415cc95b4103b2933f921e62dd36
              name: '[{#NAME}]: Self-test passed'
              type: DEPENDENT
              key: 'smart.disk.test[{#NAME}]'
              value_type: CHAR
              description: 'The disk is passed the SMART self-test or not.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.self_test_passed
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: health
                - tag: diskname
                  value: '{#NAME}'
                - tag: serial
                  value: '{#SN}'
                - tag: model
                  value: '{#MODEL}'
                - tag: disktype
                  value: '{#DISKTYPE}'
              trigger_prototypes:
                - uuid: 304bd042b7644a31bb74a1e71808d196
                  expression: 'last(/SMART by Zabbix agent 2 active/smart.disk.test[{#NAME}])="false"'
                  name: 'SMART: [{#NAME}]: Disk self-test is not passed'
                  priority: HIGH
                  tags:
                    - tag: scope
                      value: notice
            - uuid: a7a86b4098ec45baad4cea4f7e9e4ca2
              name: '[{#NAME}]: Pending sectors'
              type: DEPENDENT
              key: 'smart.disk.attribute.current_pending_sector[{#NAME}]'
              discover: NO_DISCOVER
              description: 'Homelab addition. Sectors the drive could not read and is waiting to remap on the next write. Any non-zero value on a single-disk pool means data under those sectors is already unreadable.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.current_pending_sector.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: serial
                  value: '{#SN}'
                - tag: model
                  value: '{#MODEL}'
                - tag: disktype
                  value: '{#DISKTYPE}'
                - tag: homelab
                  value: smart
              trigger_prototypes:
                - uuid: e176740425bc4a4bb1ed29a31e53e5e3
                  expression: 'last(/SMART by Zabbix agent 2 active/smart.disk.attribute.current_pending_sector[{#NAME}])>0'
                  name: 'Homelab SMART: [{#NAME}] {#MODEL} {#SN}: pending sectors present'
                  priority: HIGH
                  description: 'Unreadable sectors waiting for remap. On the pve2 WD Red this sat at 16 with no stock alert. Plan the replacement; do not zpool clear.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: homelab
                      value: smart
                - uuid: d15d1ff512884decb7b6f14a52e0c4f5
                  expression: 'last(/SMART by Zabbix agent 2 active/smart.disk.attribute.current_pending_sector[{#NAME}])>min(/SMART by Zabbix agent 2 active/smart.disk.attribute.current_pending_sector[{#NAME}],24h)'
                  name: 'Homelab SMART: [{#NAME}] {#MODEL} {#SN}: pending sectors rising (24h)'
                  priority: WARNING
                  description: 'Current_Pending_Sector grew within the last 24h: the surface failure is progressing.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: homelab
                      value: smart
            - uuid: 0f3c09b7c21347ee90e04e594bf3a44a
              name: '[{#NAME}]: Uncorrectable sectors'
              type: DEPENDENT
              key: 'smart.disk.attribute.offline_uncorrectable[{#NAME}]'
              discover: NO_DISCOVER
              description: 'Homelab addition. Sectors confirmed unreadable by the drive offline scan.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.offline_uncorrectable.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: serial
                  value: '{#SN}'
                - tag: model
                  value: '{#MODEL}'
                - tag: disktype
                  value: '{#DISKTYPE}'
                - tag: homelab
                  value: smart
              trigger_prototypes:
                - uuid: 1dc571105e4841f0a594ceba4e7bf9aa
                  expression: 'last(/SMART by Zabbix agent 2 active/smart.disk.attribute.offline_uncorrectable[{#NAME}])>0'
                  name: 'Homelab SMART: [{#NAME}] {#MODEL} {#SN}: uncorrectable sectors present'
                  priority: HIGH
                  description: 'Offline_Uncorrectable is non-zero: the drive has confirmed bad sectors. Replace.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: homelab
                      value: smart
                - uuid: 31e8e91e714440f89ee3263c2bde1ee8
                  expression: 'last(/SMART by Zabbix agent 2 active/smart.disk.attribute.offline_uncorrectable[{#NAME}])>min(/SMART by Zabbix agent 2 active/smart.disk.attribute.offline_uncorrectable[{#NAME}],24h)'
                  name: 'Homelab SMART: [{#NAME}] {#MODEL} {#SN}: uncorrectable sectors rising (24h)'
                  priority: WARNING
                  description: 'Offline_Uncorrectable grew within the last 24h.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: homelab
                      value: smart
            - uuid: 62236011e06a439cbad6662a0b6a8aab
              name: '[{#NAME}]: CRC errors'
              type: DEPENDENT
              key: 'smart.disk.attribute.udma_crc_error_count[{#NAME}]'
              discover: NO_DISCOVER
              description: 'Homelab addition. Interface CRC errors. Rising values point at the SATA/USB cable or controller path, not the platters.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.udma_crc_error_count.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: serial
                  value: '{#SN}'
                - tag: model
                  value: '{#MODEL}'
                - tag: disktype
                  value: '{#DISKTYPE}'
                - tag: homelab
                  value: smart
              trigger_prototypes:
                - uuid: 285311d7f6b74c00a568ad89a0d0face
                  expression: 'last(/SMART by Zabbix agent 2 active/smart.disk.attribute.udma_crc_error_count[{#NAME}])>min(/SMART by Zabbix agent 2 active/smart.disk.attribute.udma_crc_error_count[{#NAME}],24h)'
                  name: 'Homelab SMART: [{#NAME}] {#MODEL} {#SN}: interface CRC errors rising (24h)'
                  priority: WARNING
                  description: 'UDMA_CRC_Error_Count grew within the last 24h: check the cable, enclosure or controller before blaming the disk.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: homelab
                      value: smart
            - uuid: ee697f21df1d46c2a79b595e5a9a9d7f
              name: '[{#NAME}]: Homelab NVMe SMART raw'
              type: ZABBIX_ACTIVE
              key: 'custom.nvme.smart[{#PATH}]'
              delay: 10m
              timeout: 30s
              history: '0'
              value_type: TEXT
              description: 'Homelab addition. Raw smartctl -j -A output for NVMe, via the custom.nvme.smart UserParameter (needs /usr/local/bin/nvme-smart-json.sh on the host). Feeds the available spare items the stock plugin does not expose.'
              tags:
                - tag: component
                  value: raw
                - tag: component
                  value: storage
                - tag: homelab
                  value: smart
            - uuid: b7efca265faf4542bd69d2d5615ef7d5
              name: '[{#NAME}]: Homelab NVMe available spare'
              type: DEPENDENT
              key: 'custom.nvme.available_spare[{#NAME}]'
              units: '%'
              description: 'Homelab addition. Remaining spare flash capacity in percent (100 = untouched). The pve3 Acer FA100 sits at 43 after the lightning event.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.nvme_smart_health_information_log.available_spare
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'custom.nvme.smart[{#PATH}]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: serial
                  value: '{#SN}'
                - tag: model
                  value: '{#MODEL}'
                - tag: disktype
                  value: '{#DISKTYPE}'
                - tag: homelab
                  value: smart
              trigger_prototypes:
                - uuid: a459c4e258544245b6fd37f4f9ddfb9b
                  expression: 'last(/SMART by Zabbix agent 2 active/custom.nvme.available_spare[{#NAME}])<50'
                  name: 'Homelab SMART: [{#NAME}] {#MODEL} {#SN}: available spare below 50%'
                  priority: WARNING
                  description: 'Over half of the spare flash is consumed. Reduce writes, plan a replacement.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: homelab
                      value: smart
                - uuid: cc18a608ab7644b8b080f14f1814d2b6
                  expression: 'last(/SMART by Zabbix agent 2 active/custom.nvme.available_spare[{#NAME}])<min(/SMART by Zabbix agent 2 active/custom.nvme.available_spare[{#NAME}],24h)'
                  name: 'Homelab SMART: [{#NAME}] {#MODEL} {#SN}: available spare dropped (24h)'
                  priority: WARNING
                  description: 'Available spare fell within the last 24h: the SSD is actively retiring blocks.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: homelab
                      value: smart
                - uuid: 96cdc398961e4fc8bc407806ffbd4aba
                  expression: 'last(/SMART by Zabbix agent 2 active/custom.nvme.available_spare[{#NAME}])<20 or last(/SMART by Zabbix agent 2 active/custom.nvme.available_spare[{#NAME}])<=last(/SMART by Zabbix agent 2 active/custom.nvme.available_spare_threshold[{#NAME}]) or last(/SMART by Zabbix agent 2 active/smart.disk.media_errors[{#NAME}])>min(/SMART by Zabbix agent 2 active/smart.disk.media_errors[{#NAME}],24h)'
                  name: 'Homelab SMART: [{#NAME}] {#MODEL} {#SN}: NVMe failing (spare <20%, at threshold, or media errors rising)'
                  priority: HIGH
                  description: 'Spare flash nearly gone, at the vendor threshold, or new media errors in 24h. Move data now.'
                  tags:
                    - tag: scope
                      value: availability
                    - tag: homelab
                      value: smart
            - uuid: 4fc380e6765844768d90ef46cb1af64e
              name: '[{#NAME}]: Homelab NVMe available spare threshold'
              type: DEPENDENT
              key: 'custom.nvme.available_spare_threshold[{#NAME}]'
              units: '%'
              description: 'Homelab addition. Vendor threshold below which the drive reports itself as failing.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.nvme_smart_health_information_log.available_spare_threshold
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'custom.nvme.smart[{#PATH}]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: serial
                  value: '{#SN}'
                - tag: model
                  value: '{#MODEL}'
                - tag: disktype
                  value: '{#DISKTYPE}'
                - tag: homelab
                  value: smart
          overrides:
            - name: Self-test
              step: '1'
              filter:
                conditions:
                  - macro: '{#DISKTYPE}'
                    value: nvme
              operations:
                - operator: LIKE
                  value: Self-test
                  discover: NO_DISCOVER
            - name: 'Not NVMe'
              step: '2'
              filter:
                conditions:
                  - macro: '{#DISKTYPE}'
                    value: nvme
                    operator: NOT_MATCHES_REGEX
              operations:
                - operator: REGEXP
                  value: Media|Percentage|Critical
                  discover: NO_DISCOVER
            - name: Raw_Read_Error_Rate
              step: '3'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Raw_Read_Error_Rate
              operations:
                - operator: REGEXP
                  value: Raw_Read_Error_Rate
                  discover: DISCOVER
            - name: Spin_Up_Time
              step: '4'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Spin_Up_Time
              operations:
                - operator: REGEXP
                  value: Spin_Up_Time
                  discover: DISCOVER
            - name: Start_Stop_Count
              step: '5'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Start_Stop_Count
              operations:
                - operator: REGEXP
                  value: Start_Stop_Count
                  discover: DISCOVER
            - name: Power_Cycle_Count
              step: '6'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Power_Cycle_Count
              operations:
                - operator: REGEXP
                  value: Power_Cycle_Count
                  discover: DISCOVER
            - name: Reported_Uncorrect
              step: '7'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Reported_Uncorrect
              operations:
                - operator: REGEXP
                  value: Reported_Uncorrect
                  discover: DISCOVER
            - name: Seek_Error_Rate
              step: '8'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Seek_Error_Rate
              operations:
                - operator: REGEXP
                  value: Seek_Error_Rate
                  discover: DISCOVER
            - name: Bad_Block_Rate
              step: '9'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Bad_Block_Rate
              operations:
                - operator: REGEXP
                  value: Bad_Block_Rate
                  discover: DISCOVER
            - name: Program_Fail_Count_Chip
              step: '10'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Program_Fail_Count_Chip
              operations:
                - operator: REGEXP
                  value: Program_Fail_Count_Chip
                  discover: DISCOVER
            - name: Reallocated_Sector_Ct
              step: '11'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Reallocated_Sector_Ct
              operations:
                - operator: REGEXP
                  value: Reallocated_Sector_Ct
                  discover: DISCOVER
            - name: Current_Pending_Sector
              step: '12'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Current_Pending_Sector
              operations:
                - operator: REGEXP
                  value: 'Pending sectors'
                  discover: DISCOVER
            - name: Offline_Uncorrectable
              step: '13'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: Offline_Uncorrectable
              operations:
                - operator: REGEXP
                  value: 'Uncorrectable sectors'
                  discover: DISCOVER
            - name: UDMA_CRC_Error_Count
              step: '14'
              filter:
                conditions:
                  - macro: '{#ATTRIBUTES}'
                    value: UDMA_CRC_Error_Count
              operations:
                - operator: REGEXP
                  value: 'CRC errors'
                  discover: DISCOVER
            - name: 'Homelab NVMe only'
              step: '15'
              filter:
                conditions:
                  - macro: '{#DISKTYPE}'
                    value: nvme
                    operator: NOT_MATCHES_REGEX
              operations:
                - operator: REGEXP
                  value: 'Homelab NVMe'
                  discover: NO_DISCOVER
          graph_prototypes:
            - uuid: f27abdcf9c5242f092413156f93516f5
              name: 'Homelab SMART: [{#NAME}] {#MODEL} {#SN}: bad sector counters'
              graph_items:
              - sortorder: '0'
                color: 1A7C11
                item:
                  host: 'SMART by Zabbix agent 2 active'
                  key: 'smart.disk.attribute.reallocated_sector_ct[{#NAME}]'
              - sortorder: '1'
                color: F63100
                item:
                  host: 'SMART by Zabbix agent 2 active'
                  key: 'smart.disk.attribute.current_pending_sector[{#NAME}]'
              - sortorder: '2'
                color: 2774A4
                item:
                  host: 'SMART by Zabbix agent 2 active'
                  key: 'smart.disk.attribute.offline_uncorrectable[{#NAME}]'
              - sortorder: '3'
                color: A54F10
                item:
                  host: 'SMART by Zabbix agent 2 active'
                  key: 'smart.disk.attribute.udma_crc_error_count[{#NAME}]'
            - uuid: 22c487956d6a4d5a9ae93ded7e9dc6a3
              name: 'Homelab SMART: [{#NAME}] {#MODEL} {#SN}: NVMe spare and wear'
              graph_items:
              - sortorder: '0'
                color: 1A7C11
                item:
                  host: 'SMART by Zabbix agent 2 active'
                  key: 'custom.nvme.available_spare[{#NAME}]'
              - sortorder: '1'
                color: F63100
                item:
                  host: 'SMART by Zabbix agent 2 active'
                  key: 'smart.disk.percentage_used[{#NAME}]'
              - sortorder: '2'
                color: 2774A4
                item:
                  host: 'SMART by Zabbix agent 2 active'
                  key: 'smart.disk.media_errors[{#NAME}]'
      tags:
        - tag: class
          value: storage
        - tag: target
          value: hdd
        - tag: target
          value: ssd
      macros:
        - macro: '{$SMART.DISK.NAME.MATCHES}'
          value: '^.*$'
          description: 'This macro is used in the filter of attribute and disk discoveries. It can be overridden on the host or linked on the template level.'
        - macro: '{$SMART.DISK.NAME.NOT_MATCHES}'
          value: CHANGE_IF_NEEDED
          description: 'This macro is used in the filter of attribute and disk discoveries. It can be overridden on the host or linked on the template level.'
        - macro: '{$SMART.TEMPERATURE.MAX.CRIT}'
          value: '65'
          description: 'This macro is used for trigger expression. It can be overridden on the host or linked on the template level.'
        - macro: '{$SMART.TEMPERATURE.MAX.WARN}'
          value: '50'
          description: 'This macro is used for trigger expression. It can be overridden on the host or linked on the template level.'
        - macro: '{$SMART.TEMPERATURE.MAX.CRIT:"nvme"}'
          value: '75'
          description: 'Homelab: critical threshold for NVMe disks (context = {#DISKTYPE} from the discovery). NVMe runs 50 to 65 C in a small case and throttles near 85; the context-less 65 is for spinning disks. Card s24n9c7q8aye.'
        - macro: '{$SMART.TEMPERATURE.MAX.WARN:"nvme"}'
          value: '60'
          description: 'Homelab: warning threshold for NVMe disks. HDDs keep the context-less 50.'
        - macro: '{$SMART.TEMPERATURE.MAX.CRIT:"ssd"}'
          value: '70'
          description: 'Homelab: critical threshold for SATA SSDs.'
        - macro: '{$SMART.TEMPERATURE.MAX.WARN:"ssd"}'
          value: '55'
          description: 'Homelab: warning threshold for SATA SSDs.'
      dashboards:
        - uuid: 3168a06be7744331b78574fbbc28826e
          name: 'SMART: Overview'
          pages:
            - name: Temperature
              widgets:
                - type: graphprototype
                  width: '72'
                  height: '20'
                  fields:
                    - type: ITEM_PROTOTYPE
                      name: itemid.0
                      value:
