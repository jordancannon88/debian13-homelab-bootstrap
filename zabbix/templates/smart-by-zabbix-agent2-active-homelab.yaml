            - uuid: 643276ac0dab47b8974e849a1574ac2a
              name: '[{#NAME}]: Reallocated_Sector_Ct'
              type: DEPENDENT
              key: 'smart.disk.attribute.reallocated_sector_ct[{#NAME}]'
