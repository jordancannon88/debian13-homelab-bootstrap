zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: e960332b3f6c46a1956486d4f3f99fce
      name: 'Templates/Server hardware'
  templates:
    - uuid: e518b1340ce44d7389d2cc7c304a97b4
      template: 'SMART by Zabbix agent 2 active'
      name: 'SMART by Zabbix agent 2 active'
      description: |
        The template for monitoring S.M.A.R.T. attributes of physical disk that works without any external scripts. It collects metrics by Zabbix agent 2 version 5.0 and later with Smartmontools version 7.1 and later. Disk discovery LLD rule finds all HDD, SSD, NVMe disks with S.M.A.R.T. enabled. Attribute discovery LLD rule have pre-defined Vendor Specific Attributes for each disk, and will be discovered if attribute is present.
        
        Setup:
        
        1. Install Zabbix agent 2 and Smartmontools 7.1 or newer.
        
        2. Ensure the path to the "smartctl" executable is correctly specified. You can either provide the full path to the executable (e.g., "/usr/sbin/smartctl" on Linux or "C:\Program Files\smartctl\smartctl.exe" on Windows) in the configuration file or ensure that the folder containing the "smartctl" executable is added to the system's environment variables ("PATH"). This applies to both Linux and Windows systems.
        
        Example for Linux:      
        Plugins.Smart.Path=/usr/sbin/smartctl
        
        Example for Windows:
        Plugins.Smart.Path="C:\Program Files\smartctl\smartctl.exe"
        
        3. Grant Zabbix agent 2 super/admin user privileges for the "smartctl" utility (not required for Windows). Example for Linux (add the line that grants execution of the "smartctl" utility without the password):
        
        - Run the "visudo" command to edit the "sudoers" file:
        sudo visudo
        
        - Add the permission line and save the changes:
        zabbix ALL=(ALL) NOPASSWD:/usr/sbin/smartctl
        
        You can discuss this template or leave feedback on our forum https://www.zabbix.com/forum/zabbix-suggestions-and-feedback/415662-discussion-thread-for-official-zabbix-smart-disk-monitoring
        
        Generated by official Zabbix template tool "Templator"
      vendor:
        name: Zabbix
        version: 7.4-1
      groups:
        - name: 'Templates/Server hardware'
      discovery_rules:
        - uuid: 0a56a348d4a446938beae1eae5ec8993
          name: 'Disk discovery'
          type: ZABBIX_ACTIVE
          key: smart.disk.discovery
          delay: 10m
          timeout: 30s
          filter:
            evaltype: AND
            conditions:
              - macro: '{#NAME}'
                value: '{$SMART.DISK.NAME.MATCHES}'
              - macro: '{#NAME}'
                value: '{$SMART.DISK.NAME.NOT_MATCHES}'
                operator: NOT_MATCHES_REGEX
          description: 'Discovery SMART disks.'
          item_prototypes:
            - uuid: b3891b80915c4e2488f2f87cb173474a
              name: '[{#NAME}]: Bad_Block_Rate'
              type: DEPENDENT
              key: 'smart.disk.attribute.bad_block_rate[{#NAME}]'
              discover: NO_DISCOVER
              description: 'Percentage of used reserve blocks divided by total reserve blocks.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - $.bad_block_rate.value
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 6h
              master_item:
                key: 'smart.disk.get[{#PATH},"{#RAIDTYPE}"]'
              tags:
                - tag: component
                  value: attribute
                - tag: component
                  value: storage
                - tag: diskname
                  value: '{#NAME}'
                - tag: serial
                  value: '{#SN}'
                - tag: model
                  value: '{#MODEL}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: 512c44706bff48fda2ef444713d93b29
