                  value: '{#NAME}'
                - tag: serial
                  value: '{#SN}'
                - tag: model
                  value: '{#MODEL}'
                - tag: disktype
                  value: '{#DISKTYPE}'
            - uuid: 0861b008b09a41799978e085625aaa4a
