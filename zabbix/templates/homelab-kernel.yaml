zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: bf6177b54b3f4fe39b327f18494c3001
      name: Templates/Custom
  templates:
    - uuid: c435643350b142d4a835b726387b0066
      template: 'Homelab kernel'
      name: 'Homelab kernel'
      description: 'Kernel-journal signals that mean a host is stalling, not just busy. custom.kernel.hung_tasks counts "blocked for more than N seconds" lines this boot (kernel-hung-tasks.sh reads the kernel journal as the zabbix user, systemd-journal group): a disk or NFS mount stopped answering for minutes. On 2026-09-17 a stalled SSD on pve1 blocked ZFS txg_sync and froze the opn1 firewall VM for 40 min with it (Kan jk9mlmclsl9m). Two levels since 2026-09-20: a Warning when one or two tasks block in an hour, which self-clears and is ordinary on a USB pool during backups, and a High when three or more block within half an hour, which is a real stall and closes by hand. Link to every bare-metal node and VM (not to containers: their kernel journal is the host). Host side installed by debian13-homelab-bootstrap monitoring.sh (setup_kernel_watch). Source of truth: zabbix/templates/homelab-kernel.yaml in that repo. Dry run: echo "INFO: task txg_sync:1 blocked for more than 120 seconds." | sudo tee /dev/kmsg. Docs: catalog link/376.'
      groups:
        - name: Templates/Custom
      items:
        - uuid: cb18c67f7f4b4214811a9efda79b858d
          name: 'Kernel hung tasks this boot'
          type: ZABBIX_ACTIVE
          key: custom.kernel.hung_tasks
          delay: 1m
          description: 'Count of "task ... blocked for more than N seconds" lines in the kernel journal for the current boot. Resets to 0 on reboot.'
          tags:
            - tag: component
              value: kernel
          triggers:
            - uuid: bc9b23e8168c49fb950167172cff657e
              expression: '(last(/Homelab kernel/custom.kernel.hung_tasks)-min(/Homelab kernel/custom.kernel.hung_tasks,30m))>=3'
              recovery_mode: NONE
              name: 'Kernel: host stalling, 3 or more tasks blocked in 30 minutes on {HOST.NAME} ({ITEM.LASTVALUE1} this boot)'
              url: 'https://bookstack.local.cannon.dev/link/447'
              url_name: Runbook
              priority: HIGH
              description: 'Three or more tasks stuck in uninterruptible sleep within half an hour: a disk, a USB bridge or an NFS server has stopped answering, not just slowed down. Everything waiting on that device is frozen meanwhile; on a node that hosts the firewall the LAN loses DNS and routing (pve1, 2026-09-17, Kan jk9mlmclsl9m). Read `dmesg -T | grep -A6 "blocked for more than"` for the task name (txg_sync or zvol = ZFS waiting on the disk, nfs = the NFS server, usb-storage = the enclosure) and `vmstat 1 5` for the blocked-process count. Never recovers on its own; close by hand once the cause is known. A single blocked task during a backup or a scrub on a USB pool raises the Warning below instead.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
            - uuid: fb9ada10feeb482fa5cf97f0cc591f0d
              expression: '(last(/Homelab kernel/custom.kernel.hung_tasks)-min(/Homelab kernel/custom.kernel.hung_tasks,1h))>0'
              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: '(last(/Homelab kernel/custom.kernel.hung_tasks)-min(/Homelab kernel/custom.kernel.hung_tasks,1h))=0'
              name: 'Kernel: a task blocked over 2 minutes on {HOST.NAME} ({ITEM.LASTVALUE1} this boot)'
              url: 'https://bookstack.local.cannon.dev/link/447'
              url_name: Runbook
              priority: WARNING
              description: 'One or two tasks waited over two minutes on a device in the last hour. On a USB-attached pool this is ordinary during a backup, a resync or a scrub, because usb-storage queues one command at a time; pve3 and pve4 do it most nights. Clears itself once an hour passes with no new blocked task, so it needs no manual close. It becomes the High above if three or more happen within half an hour, which is a real stall. Worth reading if it appears on a node with no heavy IO running.'
              dependencies:
                - name: 'Kernel: host stalling, 3 or more tasks blocked in 30 minutes on {HOST.NAME} ({ITEM.LASTVALUE1} this boot)'
                  expression: '(last(/Homelab kernel/custom.kernel.hung_tasks)-min(/Homelab kernel/custom.kernel.hung_tasks,30m))>=3'
              tags:
                - tag: scope
                  value: availability
      tags:
        - tag: class
          value: custom
